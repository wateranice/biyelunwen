# 10 轮快速预览：与 ch4_compare 超参一致，仅 model_path 不同，避免覆盖正式 30 轮权重。
# 使用：
#   python main.py configs/ch4_adaptive_round10_preview.yaml --rounds-override 10
#   python utils/plot_run_log.py weights/ch4/adaptive_cifar10_dirichlet_r10_preview_run_log.npz

experiment:
  seed: 42
  data_root: ./data
  dataset: cifar10
  eval_batch_size: 256

server:
  device: auto
  global_rounds: 30
  lam: 0.1
  aggregation_weight_lr: 0.01
  shrink_sum: 1.0
  proxy_batch_size: 64

client:
  num_clients: 10
  batch_size: 128
  local_epochs: 2
  learning_rate: 0.01
  momentum: 0.9
  dirichlet_beta: 0.5
  partition: dirichlet
  proxy_ratio: 0.04
  proxy_disjoint_from_clients: true
  fedprox_mu: 0.01

output:
  model_path: weights/ch4/adaptive_cifar10_dirichlet_r10_preview.pth
