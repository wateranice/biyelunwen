# E3-3 / 第4章：病态划分对比（与 ch4_compare 超参一致，仅 partition 与权重路径不同）
# 使用：python experiments/comparison_aligned.py configs/ch4_pathological.yaml --betas 0.1 0.5 --thresholds 50,55,60

experiment:
  seed: 42
  data_root: ./data
  dataset: cifar10
  eval_batch_size: 256

server:
  device: auto
  global_rounds: 30
  lam: 0.1
  aggregation_weight_lr: 0.01
  shrink_sum: 1.0
  proxy_batch_size: 64

client:
  num_clients: 10
  batch_size: 128
  local_epochs: 2
  learning_rate: 0.01
  momentum: 0.9
  dirichlet_beta: 0.5
  partition: pathological
  proxy_ratio: 0.04
  proxy_disjoint_from_clients: true
  fedprox_mu: 0.01

output:
  model_path: weights/ch4/adaptive_cifar10_pathological.pth
